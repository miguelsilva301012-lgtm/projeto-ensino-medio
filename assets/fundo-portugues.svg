  <g clip-path="url(#word-person)" fill="#5f4b38" opacity=".95">
    <rect x="260" y="194" width="240" height="300" fill="#6b5945"/>
    <text x="275" y="227" font-family="cursive" font-size="10">palavra, leitura, lembrança e poesia</text>
    <text x="275" y="243" font-family="cursive" font-size="10">cada frase abre caminhos no pensamento</text>
    <text x="275" y="259" font-family="cursive" font-size="10">uma voz antiga atravessa o tempo</text>
    <text x="275" y="275" font-family="cursive" font-size="10">a imaginação desenha outros mundos</text>
    <text x="275" y="291" font-family="cursive" font-size="10">ler observar perguntar escrever sonhar</text>
    <text x="275" y="307" font-family="cursive" font-size="10">mitos estrelas viagens e histórias</text>
    <text x="275" y="323" font-family="cursive" font-size="10">o sentido nasce no encontro das palavras</text>
    <text x="275" y="339" font-family="cursive" font-size="10">poesia memória linguagem e criação</text>
    <text x="275" y="355" font-family="cursive" font-size="10">uma frase pode iluminar uma ideia</text>
    <text x="275" y="371" font-family="cursive" font-size="10">escutar a voz do texto com cuidado</text>
    <text x="275" y="387" font-family="cursive" font-size="10">perguntas abrem janelas na página</text>
    <text x="275" y="403" font-family="cursive" font-size="10">palavra, leitura, lembrança e poesia</text>
    <text x="275" y="419" font-family="cursive" font-size="10">cada frase abre caminhos no pensamento</text>
    <text x="275" y="435" font-family="cursive" font-size="10">a imaginação desenha outros mundos</text>
    <text x="275" y="451" font-family="cursive" font-size="10">ler observar perguntar escrever sonhar</text>
  </g>
