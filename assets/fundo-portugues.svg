    <text x="218" y="252" font-family="serif" font-size="9" font-style="italic" fill="#755b3e">“As palavras também guardam memórias.”</text>
    <text x="218" y="269" font-family="serif" font-size="9" fill="#755b3e">Ler é viajar por ideias, tempos e lugares.</text>
