  <g fill="#f3f3ef" font-family="Georgia,serif" font-style="italic" opacity=".92">
    <text x="15" y="35" font-size="16">a² + b² = c²</text>
    <text x="170" y="37" font-size="14">x = (-b ± √(b² - 4ac)) / 2a</text>
    <text x="438" y="31" font-size="17">D = b² - 4ac</text>
    <text x="660" y="35" font-size="15">π = 3,14159...</text>
    <text x="24" y="151" font-size="16">(a + b)² = a² + 2ab + b²</text>
    <text x="266" y="141" font-size="17">√(x²) = |x|</text>
    <text x="471" y="151" font-size="16">sen² θ + cos² θ = 1</text>
    <text x="700" y="151" font-size="16">e = 2,71828...</text>
    <text x="19" y="349" font-size="15">aₙ = a₁ + (n − 1) · d</text>
    <text x="279" y="333" font-size="15">lim (sin x / x) = 1</text>
    <text x="522" y="350" font-size="16">∫ x² dx = x³/3 + C</text>
    <text x="723" y="345" font-size="15">logₐ(xy) = logₐx + logₐy</text>
    <text x="32" y="484" font-size="16">tan θ = sen θ / cos θ</text>
    <text x="313" y="479" font-size="16">Σ (i = 1 → n) i = n(n+1)/2</text>
    <text x="638" y="489" font-size="15">A = πr² · V = πr²h</text>
    <text x="28" y="664" font-size="14">1 + r + r² + ... + rⁿ = (rⁿ⁺¹ − 1)/(r − 1)</text>
    <text x="429" y="657" font-size="15">f′(x) = limₕ→₀ [f(x+h) − f(x)]/h</text>
    <text x="736" y="656" font-size="15">∠ = 90°</text>
  </g>

